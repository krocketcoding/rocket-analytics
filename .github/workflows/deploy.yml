name: Build and deploy site

on:
  push:
    branches: [master]
  schedule:
    - cron: "23 */4 * * *"  # Rebuild every 4 hours (off the congested top-of-hour slot) to get fresh launch data
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Pushes supersede any run in progress; scheduled runs queue instead.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip
      - uses: actions/cache@v6
        with:
          path: |
            launch-cache.json
            image-cache/
          key: data-cache-${{ github.run_id }}
          restore-keys: data-cache-
      - name: Install dependencies
        run: pip install -r requirements.txt
      # --fetch pulls only what changed since the archive watermark (a few
      # requests); max-cache-age skips it entirely when the last fetch was
      # within 3 hours.
      - name: Run Python build command
        run: python main.py build --fetch --max-cache-age 3
        env:
          LL2_API_KEY: ${{ secrets.LL2_API_KEY }}
      # Pin Node for the JS tests — runner images drift over time.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Test after the build: node --test reads the dataset out of the
      # generated site/index.html. Any failure stops the deploy.
      - name: Run Python tests
        run: python -m unittest discover tests
      - name: Run JavaScript tests
        run: node --test
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/
      - id: deployment
        uses: actions/deploy-pages@v5
